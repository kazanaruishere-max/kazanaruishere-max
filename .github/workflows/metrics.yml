name: Metrics
on:
  # Runs daily at 05:00 UTC
  schedule: [{cron: "0 5 * * *"}]
  # Runs manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnostic token repo access
        run: |
          echo "== METRICS_TOKEN plain list =="
          curl -s -H "Authorization: token ${{ secrets.METRICS_TOKEN }}" "https://api.github.com/users/kazanaruishere-max/repos?per_page=5&sort=updated" | jq -r 'if type=="array" then "count_visible="+((length|tostring))+" names="+([.[].name]|join(",")) else .message end'
          echo "== METRICS_TOKEN owner affiliation =="
          curl -s -H "Authorization: token ${{ secrets.METRICS_TOKEN }}" "https://api.github.com/users/kazanaruishere-max/repos?per_page=5&affiliation=owner" | jq -r 'if type=="array" then "count="+(length|tostring) else .message end'
          echo "== GITHUB_TOKEN plain list =="
          curl -s -H "Authorization: token ${{ github.token }}" "https://api.github.com/users/kazanaruishere-max/repos?per_page=5&sort=updated" | jq -r 'if type=="array" then "count_visible="+((length|tostring))+" names="+([.[].name]|join(",")) else .message end'
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kazanaruishere-max
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned, starred, random
          plugin_stars: yes
          plugin_stars_limit: 4
          output_action: commit
          output_condition: data-changed